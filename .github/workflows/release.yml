name: Release

# Push a tag like v0.1.0 (matching the version in addon.xml) to publish
# an installable zip on the Releases page.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/validate_channels.py
      - name: Tag matches addon.xml
        run: |
          v=$(grep -oP '<addon[^>]+version="\K[^"]+' plugin.video.babaroga/addon.xml)
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "addon.xml says $v, tag is ${GITHUB_REF_NAME}"; exit 1; }
      - name: Build zip
        run: python tools/build_zip.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.zip --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.zip --title "BabaRoga ${GITHUB_REF_NAME}" --generate-notes
          fi
